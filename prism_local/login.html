<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4F46E5" id="meta-theme-color">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <title>Prism — Sign In</title>
  <meta name="description" content="Sign in to Prism — AI-powered social media content studio.">
  <script>
    // Apply saved/preferred theme before first paint to avoid a light-mode flash.
    (function () {
      try {
        var saved = localStorage.getItem('que_theme');
        var wantsDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (wantsDark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          var meta = document.getElementById('meta-theme-color');
          if (meta) meta.setAttribute('content', '#1A1D23');
        }
      } catch (e) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #F0F2F5;
      --surface:      #FFFFFF;
      --surface2:     #F7F8FA;
      --border:       rgba(0,0,0,0.08);
      --accent:       #4F46E5;
      --accent2:      #7C3AED;
      --text:         #1F2937;
      --text-muted:   #9CA3AF;
      --input-bg:     #F7F8FA;
      --input-border: rgba(0,0,0,0.10);
      --input-focus-bg: #FFFFFF;
      --placeholder:  #C3C8D1;
      --shadow:       rgba(0,0,0,0.08);
      --error-bg:     rgba(239,68,68,0.07);
      --error-border: rgba(239,68,68,0.22);
      --error-text:   #EF4444;
    }
    [data-theme="dark"] {
      --bg:           #101216;
      --surface:      #1A1D23;
      --surface2:     #21252C;
      --border:       rgba(255,255,255,0.09);
      --accent:       #6C7CF0;
      --accent2:      #9061F2;
      --text:         #E8EAED;
      --text-muted:   #767F8C;
      --input-bg:     #21252C;
      --input-border: rgba(255,255,255,0.12);
      --input-focus-bg: #2A2F38;
      --placeholder:  #4B5563;
      --shadow:       rgba(0,0,0,0.3);
      --error-bg:     rgba(239,68,68,0.10);
      --error-border: rgba(239,68,68,0.28);
      --error-text:   #F87171;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .card {
      width: 100%; max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px 36px;
      box-shadow: 0 4px 24px var(--shadow);
      animation: fadein 0.22s ease;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }
    @keyframes fadein { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .logo { text-align: center; margin-bottom: 6px; }
    .logo-icon { width: 64px; height: 64px; border-radius: 16px; display: block; margin: 0 auto 10px; }
    .logo-name {
      font-size: 1.6rem; font-weight: 900; letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-sub { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin-top: 2px; }
    .patent-badge { font-size: 0.62rem; color: var(--text-muted); letter-spacing: 0.04em; margin-top: 5px; opacity: 0.7; }
    .subtitle { text-align: center; font-size: 0.82rem; color: var(--text-muted); margin: 16px 0 26px; }
    .field { margin-bottom: 11px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 11px 13px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit; font-size: 0.94rem;
      outline: none;
      transition: border-color 0.16s, background-color 0.16s;
    }
    input:focus { border-color: var(--accent); background: var(--input-focus-bg); }
    input::placeholder { color: var(--placeholder); }
    .btn {
      width: 100%; margin-top: 8px; padding: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; border: none; border-radius: 10px;
      font-family: inherit; font-size: 0.98rem; font-weight: 700;
      cursor: pointer; transition: all 0.18s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 5px 18px rgba(79,70,229,0.3); }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      margin-top: 13px; padding: 9px 13px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 8px;
      color: var(--error-text);
      font-size: 0.81rem; text-align: center; display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img class="logo-icon" src="/icon-192.png" alt="Prism">
      <div class="logo-name">Prism</div>
      <div class="logo-sub">AI Creator Suite</div>
      <div class="patent-badge">Patent Pending</div>
    </div>
    <p class="subtitle">Sign in to continue</p>
    <form id="form" autocomplete="on">
      <div class="field"><input id="u" type="text" placeholder="Username" autocomplete="username" required></div>
      <div class="field"><input id="p" type="password" placeholder="Password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" id="btn">
        <span id="btn-txt">Sign In</span>
        <div class="spinner" id="spin"></div>
      </button>
      <div class="error" id="err"></div>
    </form>
    <p style="text-align:center; margin-top:18px; font-size:0.75rem; color:var(--text-muted);">
      <a href="/privacy.html" style="color:inherit;">Privacy Policy</a> &middot;
      <a href="/terms.html" style="color:inherit;">Terms of Service</a>
    </p>
  </div>
  <script>
    document.getElementById('u').focus();
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn'), txt = document.getElementById('btn-txt'), spin = document.getElementById('spin'), err = document.getElementById('err');
      btn.disabled = true; txt.style.display = 'none'; spin.style.display = 'block'; err.style.display = 'none';
      try {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('u').value.trim(), password: document.getElementById('p').value }) });
        if (res.ok) { window.location.href = '/'; }
        else { const d = await res.json().catch(() => ({})); err.textContent = d.detail || 'Invalid username or password'; err.style.display = 'block'; }
      } catch { err.textContent = 'Connection error — try again'; err.style.display = 'block'; }
      finally { btn.disabled = false; txt.style.display = ''; spin.style.display = 'none'; }
    });
  </script>
</body>
</html>
