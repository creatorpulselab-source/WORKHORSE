  <style>
    :root {
      --bg: #070b14;
      --card-bg: rgba(13, 21, 39, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #f72585;
      --cyan: #00f2fe;
      --gold: #ffd166;
    }
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(247, 37, 133, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(0, 242, 254, 0.1) 0%, transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      padding: 36px 32px 80px 32px;
      min-height: 100vh;
    }
    .header {
      max-width: 1440px;
      margin: 0 auto 32px auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }
    .title-group h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #f72585 0%, #7209b7 100%);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .stats-row {
      display: flex;
      gap: 16px;
    }
    .stat-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-pill strong {
      font-size: 18px;
      color: #fff;
      display: block;
      font-family: 'JetBrains Mono', monospace;
    }
    .stat-pill span {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Filters */
    .controls {
      max-width: 1440px;
      margin: 0 auto 28px auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      min-width: 90px;
    }
    .btn-filter {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn-filter:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .btn-filter.active {
      background: #f72585;
      color: #fff;
      border-color: #f72585;
      box-shadow: 0 0 15px rgba(247, 37, 133, 0.4);
    }

    /* Grid */
    .grid {
      max-width: 1440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(247, 37, 133, 0.5);
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    }
    .card-thumb-wrap {
      width: 100%;
      height: 220px;
      background: #050811;
      background-image: 
        linear-gradient(45deg, rgba(255,255,255,0.02) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255,255,255,0.02) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.02) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.02) 75%);
      background-size: 16px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px;
      cursor: pointer;
    }
    .card-thumb {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }
    .card:hover .card-thumb {
      transform: scale(1.05);
    }
    .card-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-grow: 1;
      border-top: 1px solid var(--border);
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'JetBrains Mono', monospace;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }
    .agent-pill {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      display: inline-block;
    }

    /* Lightbox Modal */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(4, 7, 15, 0.92);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }
    .modal-content {
      background: #0d1527;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    }
    .modal-header {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: #fff;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover { color: #fff; }
    .modal-body {
      padding: 24px;

      align-items: center;
      justify-content: center;
      background: #050811;

      max-height: 60vh;
    }
    .modal-img {
      max-width: 100%;
      max-height: 55vh;

    }
    .modal-footer {
      padding: 16px 22px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #090d18;
    }
    .path-text {
      font-size: 12px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      word-break: break-all;
    }
    .btn-action {
      background: #10b981;
      color: #04172a;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-action:hover { opacity: 0.9; }
  </style>
</head>

            <div class="card-meta">
              <span class="agent-pill" style="background:${a.agent_color}22; color:${a.agent_color}">${a.agent_name}</span>
              <span>${a.cat_label} &bull; ${a.size_kb} KB</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat, btn) {
      currentCat = cat;
      btn.parentElement.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function filterAgent(agent, btn) {
      currentAgent = agent;
      btn.parentElement.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function openModal(relPath, filename) {
      activePath = 'F:\\WORKHORSE\\character_graphics\\' + relPath.replace(/\//g, '\\');
      document.getElementById('modalTitle').textContent = filename;
      document.getElementById('modalImg').src = relPath;
      document.getElementById('modalPath').textContent = activePath;
      document.getElementById('previewModal').style.display = 'flex';
    }

    function closeModal(e) {
      document.getElementById('previewModal').style.display = 'none';
    }

    function copyPath() {
      navigator.clipboard.writeText(activePath).then(() => {
        alert('Copied absolute path to clipboard:\n' + activePath);
      });
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    render();
  </script>
</body>
</html>
